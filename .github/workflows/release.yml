name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: macos-latest
            script: release:mac
          - os: ubuntu-latest
            script: release:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          # PAT with push access to pathmaker4u-ai/pathmaker4u-desktop-releases.
          # secrets.GITHUB_TOKEN only covers this repo, not the separate
          # releases repo electron-builder.json publishes to.
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          # macOS notarization (scripts/notarize.js skips silently if unset).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
