name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: release:win
          - os: macos-latest
            script: release:mac
          - os: ubuntu-latest
            script: release:linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          # PAT with push access to pathmaker4u-ai/pathmaker4u-desktop-releases.
          # secrets.GITHUB_TOKEN only covers this repo, not the separate
          # releases repo electron-builder.json publishes to.
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          # macOS signing. CI runners have an empty keychain, so the
          # Developer ID cert must be supplied as a base64 .p12 — without these
          # the mac build is unsigned and notarization cannot succeed.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # macOS notarization via electron-builder's built-in notarize.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # A missing MAC_CSC_LINK does not fail the build — electron-builder just
      # ad-hoc signs and carries on, which is how an unsigned release shipped
      # before. Fail loudly here instead of publishing something that greets
      # every user with "is damaged and can't be opened".
      - name: Verify macOS build is signed and notarized
        if: matrix.os == 'macos-latest'
        run: |
          APP=$(find release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then echo "::error::No .app found in release/"; exit 1; fi
          echo "Checking $APP"
          if ! codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Developer ID Application"; then
            echo "::error::Not signed with a Developer ID certificate — is MAC_CSC_LINK set?"
            codesign -dv --verbose=2 "$APP" 2>&1 | head -5
            exit 1
          fi
          if ! spctl -a -vvv -t exec "$APP" 2>&1 | grep -q "source=Notarized Developer ID"; then
            echo "::error::Signed but NOT notarized — check APPLE_* secrets."
            spctl -a -vvv -t exec "$APP" 2>&1 | head -5
            exit 1
          fi
          echo "✓ signed and notarized"
